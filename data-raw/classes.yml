# data, settings, configuration #################################################
## repository ###################################################################
  repository:
    name:
      type: character
      description: Name of the repository.
    desc:
      type: character
      description: Description of the repository.
    data:
      type: list
      description: >
        Model objects ("bricks"), e.g., technologies, constraints, costs, etc.,
        stored in with their names as keys, or gropped in named lists.
    permit:
      type: character
      description: >
        Vector with names of classes permitted to store in the repository.
        There is a default list of permitted classes which can be extended or
        modified. Used in internal functions, it is not common to modify this slot.
    misc:
      type: list
      description: Any additional data or information to store in the object.
## calendar #####################################################################
  calendar:
    name:
      type: character
      description: >
        Name of the calendar object. Use to distingush between different structures
        and subsets of time-timeslices. The name is used to propose default folder names
        for the model/scenario scripts to separate solutions of the same scenario with
        different calendar objects.
    desc:
      type: character
      description: Description of the calendar object, for own references.
    timeframes:
      type: list
      description: >
        Named list of nested sub-annual levels with vectors of individual elements.
        The top level of the list is the highest level of the calendar, e.g., "ANNUAL".
        The lowest level is the smallest time-timeslice, e.g., "MONTH".
        "ANNUAL" is the default (hardwired) top level of the calendar. All other levels
        are optional, and create nested sub-annual levels of time-timeslices.
        The minimum number of time-timeslices in a timeframe is two (except for the top level).
    timetable:
      type: data.frame
      description: >
        Data frame with levels of timeframes in the named columns, and number of rows
        equal to the total number of time-timeslices on the lowest level. Every timeframe
        is a set of time-timeslices ("timeslices") - a named fragment of time with a year-share.
        Timeframes have nested structure where every timeslice serves as a parent for the
        lower level of time-timeslices (children).
        The first column is the name of the time-timeslice, the rest of the columns are the
        names of the timeframes. The values are the share of the year covered by the
        time-timeslice. The sum of the shares in every timeframe should be equal to 1.
        `weight` is an optional column with the weight of the time-timeslice in the year,
        used for sumpled/subset selection of the time-timeslices.
    year_fraction:
      type: numeric
      description: >
        The fraction of a year covered by the calendar, e.g. 1 for annual calendar
        (default), 0.5 for semi-annual, 0.25 for quarterly, etc. Currently must be
        specified manually for subset calendars to validate the sum of the shares.
    timeslice_share:
      type: data.frame
      description: >
        Auto-calculated from the `timetable`
        two column data.frame with timeslices from all levels with their individual share
        in a year. The first column is the name of the time-timeslice, the second column
        is the share of the year covered by the time-timeslice.
    default_timeframe:
      type: character
      description: >
        The name of the default level of the time-timeslices used in the model. If not
        specified, the lowest level of the timeframes is used as the default timeframe.
    timeframe_rank:
      type: character
      description: >
        Auto-calculated from the `timetable` and `timeframes` slots
        named character vector with ranks of the timeframes. The rank is used to
        determine the order of the timeframes in the calendar.
    timeslices_in_frame:
      type: integer
      description: >
        Auto-calculated from the `timetable`
        Number of time-timeslices in every timeframe.
    timeslice_family:
      type: data.frame
      description: >
        Auto-calculated from the `timetable`
        data.frame mapping "parent" to "child" timeslices in two nearest timeframes in the
        nested hierarchy. The first column is the name of the parent time-timeslice, the
        second column is the name of the child time-timeslice.
    timeslice_ancestry:
      type: data.frame
      description: >
        Auto-calculated from the `timetable`
        data.frame mapping "child", "grandchild", etc. timeslices to the "parent" and 
        "grandparent" time-timeslices in the full hierarchy. The first column is the name
        of the (grand-) child time-timeslice, the second column is the name of the (grand-)
        parent time-timeslice.
    next_in_timeframe:
      type: data.frame
      description: >
        Auto-calculated from the `timetable`
        data.frame mapping chronological sequence between time-timeslices in the same
        timeframe. The first column is the name of the time-timeslice, the second column
        is the name of the next time-timeslice in the same timeframe.
    next_in_year:
      type: data.frame
      description: >
        Auto-calculated from the `timetable`
        data.frame mapping chronological sequence between time-timeslices in the same
        timeframe through the whole year. The first column is the name of the time-timeslice,
        the second column is the name of the next time-timeslice in the same timeframe.
    misc:
      type: list
      description: >
        Any additional data or information to store in the object.
## horizon ######################################################################
  horizon:
    name:
      type: character
      description: >
        Name of the horizon object. Used to distinguish between different horizons
        in the model or scenario, including the automatic creation of the folder
        name for the model/scenario scripts.
    desc:
      type: character
      description: Description of the horizon object, for own references.
    period:
      type: integer
      description: >
        A planning period defined as a sequence of years (arranged, without gaps) of
        the model planning (e.g. optimization) window. Data with years before or after
        the planning `period` can present in the model-objects and will be taken into
        account during interpolation of the model parameters.
    intervals:
      type: data.frame
      description: >
        Data frame with three columns, representing start, middle, and the end year
        of every interval. The first column is the start year of the interval, the
        second column is the middle year of the interval, the third column is the end
        year of the interval.
## config #######################################################################
  config:
    name:
      type: character
      description: >
        Name of the configuration object for own references, also can be used 
        in functions to distinguish between different model or scenario
        instances.
    desc:
      type: character
      description: Description of the configuration object for own references.
    region:
      type: character
      description: >
        Coma separated string of all region names in the model.
        All regions used in the model-objects should be listed here.
    calendar:
      type: calendar
      description: Calendar object with the model time parameters.
    geoscale:
      type: ANY
      description: >
        Optional `geoscales::Geoscale` object describing the model's regions --
        their nesting into coarser levels, weights, and (optionally) geometry.
        Purely additional information about the labels in `region`, which
        remains authoritative; the geoscale is used for plotting, reporting and
        subsetting and never changes the optimisation model. `NULL` when unset.
        Typed `ANY` because `geoscales` is an optional (Suggests) dependency.
    horizon:
      type: horizon
      description: >
        Horizon object with the model time parameters. The horizon defines the
        planning period and intervals of the model.
    discount:
      type: data.frame
      description: >-
        The model's two rates, which can be assigned by region and year.
        `wacc` annuitises investment into the equivalent annual cost; `sdr`
        discounts the stream of system costs in the objective. They are
        independent -- there is no fallback from one to the other.

        As an ARGUMENT (`newModel(discount = )`, `update(cfg, discount = )`)
        this slot also accepts the shorthand `discount`, a single rate that
        plays both roles: `discount = 0.05` is equivalent to
        `data.frame(wacc = 0.05, sdr = 0.05)`. Per row you supply either
        `discount`, or both `wacc` and `sdr` -- a partial pair or a mix of the
        two forms is an error. There is no `discount` column: the shorthand is
        expanded on entry, so the stored table always has both rates.
      columns:
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        wacc:
          type: numeric
          description: >-
            Weighted average cost of capital, used to annuitise investment costs
            into `pTechEac` / `pStorageEac` / `pTradeEac`. A process may override
            it with its own `@invcost$wacc`. Default is 0.
        sdr:
          type: numeric
          description: >-
            Social discount rate, used to build the cumulative discount factor
            applied to total system costs in the objective. A property of the
            model, never of an individual process. Default is 0.
    discountFirstYear:
      type: logical
      description: >
        If TRUE, the discounting starts from the beginning of the year.
        If FALSE, the discounting starts from the end of the first year, i.e.,
        the first year is not discounted.
    optimizeRetirement:
      type: logical
      description: >
        Incidates if the retirement of capacities of the model objects 
        should be optimized. Also requires the same parameter in the
        classes with capacitu, such as `technology`, `storage`, `trade`
        to be set to TRUE to be effective for a specific object.
    defVal:
      type: data.frame
      description: >
        Default values of model parameters. The data frame with the default
        values for every parameter in the model, used to fill the missing
        values in the model objects. The values are used in the interpolation
        step. The data is stored in `energyRt::.defVal` object and can be
        overwritten by the user and supplied to the model as a parameter.
    interpolation:
      type: data.frame
      description: >
        Default interpolation rules for every parameter in the model.
        The data frame with the default interpolation rules is stored
        in `energyRt::.defInt` object and can be overwritten by the user
        and supplied to the model as a parameter.
    debug:
      type: data.frame
      description: >
        Artificial (dummy or sluck) variables to debug model infeasibility.
        Can be specified by commodities, regions, years, and timeslices.
    variant_prefix:
      type: character
      description: >
        Named character vector giving the prefixes inserted into the names of
        expanded technology variants, keyed by variant dimension:
        `c(vintage = "_VIN", cluster = "_CL")`. A technology `WIND` with vintage
        2030 and cluster "01" then becomes the set member `WIND_VIN2030_CL01`.
        Number the clusters rather than labelling them ("01", not "best"): the
        prefix already says what the axis is, so a label that repeats it reads
        as `WIND_VIN2030_CLCL01`.
        Model-wide, because these become solver set-member names; the scenario
        settings inherit the value and must agree with it. Each prefix must be
        non-empty, match `^[[:alnum:]_]+$`, and the two must differ. A partial
        value such as `c(cluster = "_RC")` is merged over the defaults.
    misc:
      type: list
      description: Any additional data or information to store in the object.
## settings #####################################################################
  settings:
    name:
      type: character
      description: >
        Name of the settings object for own references, also can be used 
        in functions to distinguish between different model or scenario
        instances.
    desc:
      type: character
      description: Description of the settings object for own references.
    subset:
      type: list
      description: >
        Named list of subsets used in the model. The names of the list elements
        are the names of the subsets, the values are the vectors of the subset
        elements. The subsets are used to narrow the dimension of the model
        variables and constraints.
    solver:
      type: list
      description: >
        Named list of solver parameters. The names of the list elements are the
        names of the solver parameters, the values are the solver parameters themselves.
        The solver parameters are used to control the optimization process.
    sourceCode:
      type: list
      description: >
        Named list of paths to the source code files. The names of the list
        elements are the names of the source code files, the values are the
        paths to the source code files. The source code files are used to
        store the model and scenario scripts.
    yearFraction:
      type: numeric
      description: >
        The fraction of a year covered by the calendar, e.g. 1 for annual calendar
        (default), 0.5 for semi-annual, 0.25 for quarterly, etc. Currently must be
        specified manually for subset calendars to validate the sum of the shares.
    misc:
      type: list
      description: Any additional data or information to store in the object.
## parameter ####################################################################
  parameter:
    name:
      type: character
      description: Name of the parameter as it appears in GAMS, Julia/JuMP, Python/Pyomo, etc.
    desc:
      type: character
      description: Description of the parameter for reference.
    type:
      type: factor
      description: >
        Type of the parameter, e.g., "set", "map", "numpar", or "bounds".
        "set" is a set of elements, "map" is a mapping between sets, "numpar"
        is a numeric parameter, "bounds" is a parameter with lower and upper bounds.
    dimSets:
      type: character
      description: >
        A vector of sets used to define the dimension of the parameter.
    defVal:
      type: numeric
      description: >
        Default value of numeric parameters. The default value is used to fill
        the missing values in the model objects. The values are used in the
        interpolation step and/or passed to the solver software.
    data:
      type: data.frame
      description: Data frame with the parameter values.
    interpolation:
      type: character
      description: >
        Interpolation rule for numeric parameters across years. 
        Recognized values are any combination
        of "back", "inter", "forth", e.g., "back.inter" or "forth.inter",
        indicating the direction of interpolation.
    inClass:
      type: character
      description: >
        The class of the parameter, e.g., "technology", "storage", "trade",
        "supply", "demand", "export", etc.
    misc:
      type: list
      description: Any additional information or data to store in the object.
## modInp #######################################################################
  modInp:
    set:
      type: list
      description: named list of character vectors with sets used in the model.
    parameters:
      type: list
      description: >
        named list of `parameter` objects with three tipes
        - set: detailed description of the set
        - parameter: all model parameters, interpolated for every milestone
          year in the model horizon if applicable. Names of parameters start 
          with 'p'
        - mapping sets: auxiliary, automatically created sets used to narrow
          the dimension of variables and constraints
    gams.equation:
      type: list
      description: >
        named list of custom constraints added to the model from the
        `constraint` class. The name of the slot is outdated and will be
        changed in the future.
    costs.equation:
      type: list
      description: >
        named list of custom costs added to the model's objective from the
        `costs` class. The name of the slot is outdated and will be
        changed in the future.
    misc:
      type: list
      description: >
        Any additional information or data to store in the object. Also used
        to store paths to the data files of objects stored on the disk.
## modOut #######################################################################
  modOut:
    sets:
      type: list
      description: >
        Named list of sets used in the model.
    variables:
      type: list
      description: >
        Named list of data frames with variables imported from solved scenario.
    stage:
      type: character
      description: >
        Indication of the solution status of the model/scenario.
    solutionLogs:
      type: data.frame
      description: >
        Data frame with the model solution logs.
    misc:
      type: list
      description: >
        Any additional information or data to store in the object.
# model and scenario ############################################################
## model ########################################################################
  model:
    name:
      type: character
      description: >
        Name of the model object, for reference, also used in scenario path-functions.
    desc:
      type: character
      description: Description of the model object, for own references.
    data:
      type: repository or list
      description: >
        A named list of model objects to interpolate and pass to the solver.
        Use the `repository` class to add objects to the model, or a list of
        model objects directly.
    config:
      type: config
      description: >
        Configuration object with the default model settings.
    misc:
      type: list
      description: Any additional data or information to store in the object.
## scenario #####################################################################
  scenario:
    name:
      type: character
      description: >
        Name of the scenario object, for reference, also used in scenario path-functions.
    desc:
      type: character
      description: >
        Description of the scenario object, for own references.
    model:
      type: model
      description: >
        Model object with the model data and configuration settings.
    settings:
      type: settings
      description: >
        Settings object with the scenario-specific settings. Initialized with the
        default settings from the model configuration object.
        Overrule the model config for the scenario-specific parameters.
    modInp:
      type: modInp
      description: >
        Model input object with the interpolated model parameters.
    modOut:
      type: modOut
      description: >
        Model output object with the model solution and logs.
    status:
      type: character
      description: >
        Indication of the solution status of the model/scenario.
    path:
      type: character
      description: >
        Path to the scenario folder with the model data and scripts.
    inMemory:
      type: logical
      description: >
        Indication if the scenario is stored in memory or on the disk.
    misc:
      type: list
      description: >
        Any additional data or information to store in the object,
        added by the user or the functions.


