################################################################################
# Description of slots in classes to use in documentation functions ############
# Edit then run `DATASET.R` to update the .classes obj in the package data #####
################################################################################
class:
# model bricks: system components ###############################################
## commodity ####################################################################
  commodity:
    name:
      type: character
      description: Name of the commodity.
    desc:
      type: character
      description: Optional description of the commodity for reference.
    limtype:
      type: factor or character
      description: >
        The limit type of the commodity in balance equation, "LO", "UP", or "FX".
        "LO" by default, meaning that the level of commodity in the model is restricted
        with the lower bound, excess is allowed. "UP" means that the level of commodity
        cannot exceed the upper bound. "FX" means that total commudity supply and demand
        are equal, no excess or deficit is allowed.
    timeframe:
      type: character
      description: >
        The default time-frame this commodity operates in the model.
        The lowest timeframe in the model is used by default.
    geolevel:
      type: character
      description: >
        The geoscale level at which this commodity is balanced -- the spatial
        counterpart of `timeframe`. The finest level in the model is used by
        default, reproducing the flat, single-level behaviour. Naming a coarser
        level (e.g. balancing steel nationally while electricity stays
        state-level) asserts free, unlimited transport of the commodity within
        that level, so it suits goods with a genuinely integrated market and
        never a network-constrained carrier such as electricity. Requires a
        geoscale on the model config; GLPK and GAMS only.
    unit:
      type: character
      description: The main unit of the commodity used in the model.
    emis:
      type: data.frame
      description: >
        Emissions factors related to the commodity consumption
        (if "combustion" parameter of a technology which consumes the commodity is > 0).
      columns:
        comm:
          type: character
          description: Name of the emitted commodity.
        unit:
          type: character
          description: Unit of the emission factor.
        emis:
          type: numeric
          description: >
            Emission factor, emissions released per unit of the consumed commodity.
    agg:
      type: data.frame
      description: >
        Used to define an aggregation of several commodities into the `name` commodity.
      columns:
        comm:
          type: character
          description: Name of a commodity being aggregated.
        unit:
          type: character
          description: Unit of the commodity being aggregated.
        agg:
          type: numeric
          description: >
            weight of the commodity in the aggregation, must be set for all aggregated commodities.
    property:
      type: data.frame
      description: >
        Physical properties of the commodity -- heating values, density, molar mass,
        composition. Reference data: it is never written to the model input, but it
        gives `convert()` the physics needed to move between measures of the same
        commodity (energy, mass, volume, amount). A property whose unit is a ratio of
        two dimensions, such as `lhv` in "GJ/t", acts as a conversion edge between
        them. Only properties of the commodity itself belong here -- anything whose
        numerator is a *different* commodity, such as a CO2 emission factor, belongs
        in `emis`. See `commodity_properties()` for the recognised names.
      columns:
        property:
          type: character
          description: >
            Name of the property, e.g. "lhv", "hhv", "density", "molar_mass", or
            "frac_C" for an element mass fraction. Unrecognised names are kept with
            a warning.
        value:
          type: numeric
          description: >
            The value of the property, in `unit`. Always the deterministic point
            estimate -- the mean, mode or best guess; `min`, `max` and `sd` describe
            uncertainty around it and are never read by `convert()`.
        min:
          type: numeric
          description: Lower bound of the value, for sensitivity analysis. Optional.
        max:
          type: numeric
          description: Upper bound of the value, for sensitivity analysis. Optional.
        sd:
          type: numeric
          description: >
            Standard deviation of the value, for sensitivity analysis. Optional.
        dist:
          type: character
          description: >
            Distribution of the value for sensitivity analysis, one of "point",
            "uniform", "triangular", "pert", "normal", or "lognormal". Optional;
            "point" or NA means the value is treated as certain. "uniform" reads
            `min` and `max`; "triangular" and "pert" read `min`, `value` (the mode)
            and `max`; "normal" and "lognormal" read `value` and `sd`.
        unit:
          type: character
          description: >
            Unit of the property, e.g. "GJ/t", "t/m3", "g/mol", "kg/kg". Applies to
            `value`, `min`, `max` and `sd` alike.
        comment:
          type: character
          description: >
            Optional note on the source of the value or the conditions it refers to,
            such as "bulk, as stockpiled" or "gas, 0 C, 1 atm".
    misc:
      type: list
      description: >
        List of additional parameters that are not used in the model but can be used
        for reference or user-defined functions. For example, links to the source
        of the commodity data, or other metadata. Two names are conventional:
        `misc$image`, a path or URL to an illustration used in reports, and
        `misc$icon`, a path or URL to a small icon. Both can be set with the `image`
        and `icon` arguments of `newCommodity`.
## supply #######################################################################
  supply:
    name:
      type: character
      description: Name of the supply object, used in sets.
    desc:
      type: character
      description: Description of the supply object.
    commodity:
      type: character
      description: The supplied commodity short name.
    unit:
      type: character
      description: The main unit of the commodity used in the model.
    weather:
      type: data.frame
      description: Weather factors to apply to the supply.
      columns:
        weather:
          type: character
          description: >
            Name of the weather factor to apply. Must match the weather factor
            names in a `weather` class in the model.
        wava.lo:
          type: numeric
          description: >
            Coefficient that links the weather factor with the lower bound of
            the availability factor `ava.lo`.
        wava.up:
          type: numeric
          description: >
            Coefficient that links the weather factor with the upper bound of
            the availability factor `ava.up`.
        wava.fx:
          type: numeric
          description: >
            Coefficient that links the weather factor with the fixed value of
            the availability factor `ava.fx`. This parameter overrides
            `wava.lo` and `wava.up`.
    reserve:
      type: data.frame
      description: >
        Total available resource. Applicable to exhaustible resources.
        Set for each region. If not set, the resource is considered infinite.
      columns:
        region:
          type: character
          description: >
            Region name to apply the parameter.
            Use NA to apply to all regions.
        res.lo:
          type: numeric
          description: Lower bound of the total available resource.
        res.up:
          type: numeric
          description: Upper bound of the total available resource.
        res.fx:
          type: numeric
          description: >
            Fixed value of the total available resource.
            This parameter overrides `res.lo` and `res.up`.
    supply:
      type: data.frame
      description: Availability of the resource in physical units.
      columns:
        region:
          type: character
          description: >
            Region name to apply the parameter.
            Use NA to apply to all regions.
        year:
          type: integer
          description: >
            Year to apply the parameter.
            Use NA to apply to all years.
        timeslice:
          type: character
          description: >
            Time timeslice to apply the parameter.
            Use NA to apply to all timeslices.
        ava.lo:
          type: numeric
          description: Lower bound of the availability factor.
        ava.up:
          type: numeric
          description: Upper bound of the availability factor.
        ava.fx:
          type: numeric
          description: >
            Fixed value of the availability factor.
            This parameter overrides `ava.lo` and `ava.up`.
        cost:
          type: numeric
          description: >
            Cost of the resource extraction,
            if not set, the resource is considered free.
    region:
      type: character
      description: >
        Regions where the supply process exists.
        Must include all regions used in other slots.
        `availability` and `reserve` slots also limit possible regions.
    misc:
      type: list
      description: >
        List of additional parameters that are not used in the model but can be used
        for reference or user-defined functions. For example, links to the source
        of the supply data, or other metadata.
## demand #######################################################################
  demand:
    name:
      type: character
      description: Name of the demand.
    desc:
      type: character
      description: Optional description of the demand for reference.
    commodity:
      type: character
      description: Name of the commodity for which the demand will be specified.
    unit:
      type: character
      description: Optional unit of the commodity.
    demand:
      type: data.frame
      description: Specification of the demand.
      columns:
        region:
          type: character
          description: Name of region for the demand value. NA for every region.
        year:
          type: integer
          description: Year of the demand. NA for every year.
        timeslice:
          type: character
          description: Name of the timeslice for the demand value. NA for every timeslice.
        demand:
          type: numeric
          description: Value of the demand.
    region:
      type: character
      description: >
        Optional name of region to narrow the specification of the demand in the case of used NAs.
        Error will be returned if specified regions in `@demand` are not mensioned in the `@region` slot
        (if the slot is not empty).
    misc:
      type: list
      description: Optional list of additional information.
## technology ###################################################################
  technology:
    name:
      type: character
      description: Name of the technology, used in sets.
    desc:
      type: character
      description: Optional description of the technology for reference.
    input:
      type: data.frame
      description: Main commodities input. Main commodities are linked to the process capacity and activity. Their parameters are defined in the `ceff` slot.
      columns:
        comm:
          type: character
          description: Name of the input commodity.
        unit:
          type: character
          description: Unit of the input commodity.
        group:
          type: character
          description: Name of input-commodities-group.
        combustion:
          type: numeric
          description: >
            combustion factor from 0 to 1 (default 1) to calculate emissions
            from fuels combustion (commodities intermediate consumption, more broadly)
    output:
      type: data.frame
      description: Main commodities output. Main commodities are linked to the process capacity and activity. Their parameters are defined in the `ceff` slot.
      columns:
        comm:
          type: character
          description: Name of the output commodity.
        unit:
          type: character
          description: Unit of the output commodity.
        group:
          type: character
          description: Name of output-commodities-group.
    aux:
      type: data.frame
      description: Auxilary commodities, both input and output, their parameters are defined in the `aeff` slot.
      columns:
        acomm:
          type: character
          description: Name of the auxilary commodity.
        unit:
          type: character
          description: Unit of the auxilary commodity.
    units:
      type: data.frame
      description: Key units of the process activity and capacity (for reference).
      columns:
        capacity:
          type: character
          description: Unit of capacity
        use:
          type: character
          description: Unit of 'use' (grouped input) if applicable.
        activity:
          type: character
          description: Unit of activity variable of the technology.
        costs:
          type: character
          description: Currency of costs variable of the technology.
    group:
      type: data.frame
      description: Details for commodity groups if defined in input and output slots (for reference).
      columns:
        group:
          type: character
          description: Name of the group. Must match the group names in the input and output slots.
        desc:
          type: character
          description: Description of the group.
        unit:
          type: character
          description: Unit of the group.
    cap2act:
      type: numeric
      description: Capacity to activity ratio. Default is 1. Specifies how much product (activity, or output commodity if identical) will be produced per unit of capacity.
    geff:
      type: data.frame
      description: Input-commodity-group efficiency parameters.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Name of region to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Name of timeslice to apply the parameter, NA for every timeslice.
        group:
          type: character
          description: Name of group to apply the parameter. Required, must match the group names in the input and output slots.
        ginp2use:
          type: numeric
          description: Group-input-to-use coefficient, default is 1.
    ceff:
      type: data.frame
      description: Main commodity and activity efficiency parameters.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Name of timeslice to apply the parameter, NA for every timeslice.
        comm:
          type: character
          description: Name of commodity to apply the parameter, different parameters require specification either input or output commodity.
        cinp2use:
          type: numeric
          description: Commodity-input-to-use coefficient, default is 1.
        use2cact:
          type: numeric
          description: Use-to-commodity-activity coefficient, default is 1.
        cact2cout:
          type: numeric
          description: Commodity-activity-to-commodity-output coefficient, default is 1.
        cinp2ginp:
          type: numeric
          description: Commodity-input-to-group-input coefficient, default is 1.
        share.lo:
          type: numeric
          description: Lower bound on a share of commodity within a group, default is 0.
        share.up:
          type: numeric
          description: Upper bound on a share of commodity within a group, default is 1.
        share.fx:
          type: numeric
          description: Fixed share of commodity within a group, ignored if NA. This parameter overrides `share.lo` and `share.up`.
        afc.lo:
          type: numeric
          description: Lower bound on the physical value of the commodity, ignored if NA.
        afc.up:
          type: numeric
          description: Upper bound on the physical value of the commodity, ignored if NA.
        afc.fx:
          type: numeric
          description: Fixed physical value of the commodity, ignored if NA. This parameter overrides `afc.lo` and `afc.up`.
    aeff:
      type: data.frame
      description: Parameters linking main commodities, activities, and capacities to auxiliary commodities.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Name of timeslice to apply the parameter, NA for every timeslice.
        acomm:
          type: character
          description: Name of auxilary commodity to apply the parameter.
        cinp2ainp:
          type: numeric
          description: Main-commodity-input-to-auxilary-commodity-input coefficient, ignored if NA.
        cinp2aout:
          type: numeric
          description: Main-commodity-input-to-auxilary-commodity-output coefficient, ignored if NA.
        cout2ainp:
          type: numeric
          description: Main-commodity-output-to-auxilary-commodity-input coefficient, ignored if NA.
        cout2aout:
          type: numeric
          description: Main-commodity-output-to-auxilary-commodity-output coefficient, ignored if NA.
        act2ainp:
          type: numeric
          description: Technology-activity-to-auxilary-commodity-input coefficient, ignored if NA.
        act2aout:
          type: numeric
          description: Technology-activity-to-auxilary-commodity-output coefficient, ignored if NA.
        cap2ainp:
          type: numeric
          description: Technology-capacity-to-auxilary-commodity-input coefficient, ignored if NA.
        cap2aout:
          type: numeric
          description: Technology-capacity-to-auxilary-commodity-output coefficient, ignored if NA.
        ncap2ainp:
          type: numeric
          description: Technology-new-capacity-to-auxilary-commodity-input-coefficient, ignored if NA.
        ncap2aout:
          type: numeric
          description: Technology-new-capacity-to-auxilary-commodity-output coefficient, ignored if NA.
    af:
      type: data.frame
      description: Timeslice-level availability factor parameters.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Name of timeslice to apply the parameter, NA for every timeslice.
        af.lo:
          type: numeric
          description: Lower bound on the availability factor, default is 0.
        af.up:
          type: numeric
          description: Upper bound on the availability factor, default is 1.
        af.fx:
          type: numeric
          description: Fixed availability factor, ignored if NA. This parameter overrides `af.lo` and `af.up`.
        rampup:
          type: numeric
          description: Ramping-up time constraint RHS value, ignored if NA. Depends on the technology timeframe.
        rampdown:
          type: numeric
          description: Ramping-down time constraint RHS value, ignored if NA. Depends on the technology timeframe.
    afs:
      type: data.frame
      description: Timeframe-level availability factor constraints.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Name of timeslice to apply the parameter, required.
        afs.lo:
          type: numeric
          description: Lower bound on the availability factor for the timeframe, default is 0.
        afs.up:
          type: numeric
          description: Upper bound on the availability factor for the timeframe, default is 1.
        afs.fx:
          type: numeric
          description: Fixed availability factor for the timeframe, ignored if NA. This parameter overrides `afs.lo` and `afs.up`.
    weather:
      type: data.frame
      description: Parameters linking `weather factors` (external shocks specified by `weather` class) to the availability parameters `af`, `afs`, and `afc`.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        weather:
          type: character
          description: Name of the applied weather factor, required, must match the weather factor names in a `weather` class in the model.
        comm:
          type: character
          description: Name of the commodity with specified `afc.*` to be affected by the weather factor, required if `afc.*` parameters are specified.
        wafc.lo:
          type: numeric
          description: Multiplying coefficient to the lower bound on the commodity availability parameter `afc.lo`, ignored if NA.
        wafc.up:
          type: numeric
          description: Multiplying coefficient to the upper bound on the commodity availability parameter `afc.up`, ignored if NA.
        wafc.fx:
          type: numeric
          description: Multiplying coefficient to the fixed value of the commodity availability parameter `afc.fx`, ignored if NA. This parameter overrides `wafc.lo` and `wafc.up`.
        waf.lo:
          type: numeric
          description: Multiplying coefficient to the lower bound on the availability factor parameter `af.lo`, ignored if NA.
        waf.up:
          type: numeric
          description: Multiplying coefficient to the upper bound on the availability factor parameter `af.up`, ignored if NA.
        waf.fx:
          type: numeric
          description: Multiplying coefficient to the fixed value on the availability factor parameter `af.fx`, ignored if NA. This parameter overrides `waf.lo` and `waf.up`.
        wafs.up:
          type: numeric
          description: Multiplying coefficient to the upper bound on the availability factor parameter `afs.up`, ignored if NA.
        wafs.lo:
          type: numeric
          description: Multiplying coefficient to the lower bound on the availability factor parameter `afs.lo`, ignored if NA.
        wafs.fx:
          type: numeric
          description: Multiplying coefficient to the fixed value on the availability factor parameter `afs.fx`, ignored if NA. This parameter overrides `wafs.lo` and `wafs.up`.
    fixom:
      type: data.frame
      description: Fixed operational and maintenance cost (per unit of capacity a year).
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        fixom:
          type: numeric
          description: Fixed operational and maintenance cost, default is 0.
    varom:
      type: data.frame
      description: Variable operational and maintenance cost (per unit of activity or commodity).
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Name of the time-timeslice or (grand-)parent timeframe to apply the parameter, NA for every time-timeslice of the technology timeframe.
        varom:
          type: numeric
          description: Variable operational and maintenance cost per unit of activity, default is 0.
        comm:
          type: character
          description: Name of the commodity for which the parameter will be applied, required for `cvarom` parameter.
        cvarom:
          type: numeric
          description: Variable operational and maintenance cost per unit of commodity, default is 0.
        acomm:
          type: character
          description: Name of the auxilary commodity for which the `avarom` will be applied, required for `avarom` parameter.
        avarom:
          type: numeric
          description: Variable operational and maintenance cost per unit of auxilary commodity, default is 0.
    invcost:
      type: data.frame
      description: Total overnight investment costs of the project (per unit of capacity).
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        invcost:
          type: numeric
          description: Total overnight investment costs of the project (per unit of capacity), default is 0.
        wacc:
          type: numeric
          description: >-
            Weighted average cost of capital used to annuitise `invcost` for
            this technology. Overrides the model-wide `wacc` (see the model
            `discount` argument). The social discount rate is never used here.
        payback:
          type: numeric
          description: >-
            Cost-recovery period in years. Where given it replaces `olife` in
            the annuity AND in the years over which the annuity is charged, so
            the investment is repaid over `payback` years while the capacity
            keeps operating for its full operational life. Must be positive and
            not exceed `olife`. Unset (or 0) means recover over `olife`.
            Implemented for the GLPK solver only.
        eac:
          type: numeric
          description: >-
            Equivalent annual cost, supplied directly instead of being computed
            from `invcost`, `wacc` and the lifetime. Where given it wins; where
            absent the annuity is computed. Mutually exclusive with `invcost`
            per row.
        retcost:
          type: numeric
          description: Costs of early retirement of the technology, default is 0.
    cluster:
      type: data.frame
      description: >-
        Declaration of the technology's clusters. A cluster is a parallel
        sub-process of the same technology -- a resource class, geography or
        fleet type -- with its own capacity, availability and costs. This slot
        declares WHAT the clusters are and WHERE they exist; the per-cluster
        values live in the `cluster` column of the variant-varying slots
        (`capacity`, `invcost`, `afs`, `weather`, ...), exactly as `group`
        declares input groups whose data lives in `input$group`.
        Optional: when empty, cluster labels are harvested from those columns.
        When populated it is authoritative -- a label used in a slot but not
        declared here raises an error instead of silently creating an extra
        technology with default (often unbounded) parameters.
      columns:
        cluster:
          type: character
          description: Cluster label. Must match the `cluster` column values used in the other slots.
        desc:
          type: character
          description: Human-readable description of the cluster, used in reports.
        region:
          type: character
          description: Region the cluster exists in, NA for every region. Several rows restrict a cluster to several regions.
        order:
          type: integer
          description: Optional display/ranking order (e.g. best to worst resource class); controls the order variants are created and reported in.
    vintage:
      type: data.frame
      description: >-
        Investment window and operational life of the technology, one row per
        (vintage, region, cluster). Replaces the former `start`, `end` and
        `olife` slots. A vintage is a separately investable variant of the
        technology that keeps the characteristics of its build year for its
        whole life; a cluster is a parallel sub-process (resource class,
        geography, fleet type) with its own capacity, availability and costs.
      columns:
        vintage:
          type: character
          description: Vintage label, normally the build year as a string. NA for an un-vintaged technology (a single variant).
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        cluster:
          type: character
          description: Cluster label, NA for every cluster.
        start:
          type: integer
          description: The first year the technology can be installed. NA means unbounded (all horizon years up to `end`); windows are user-defined and may overlap across vintages.
        end:
          type: integer
          description: The last year the technology can be installed. NA means unbounded (all horizon years from `start` on).
        olife:
          type: integer
          description: Operational life of the technology if installed during optimization, in years, default is 1.
    capacity:
      type: data.frame
      description: Capacity of the installed technology (in units of capacity).
      columns:
        vintage:
          type: character
          description: Vintage label selecting the technology variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the technology variant this row applies to, NA for every cluster. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, required, values between specified years will be interpolated.
        stock:
          type: numeric
          description: >
            Predefined capacity of the technology in units of capacity, default is 0.
            This parameter also defines the exogenous capacity retirement (age-based),
            or exogenous capacity additions, not optimized by the model, and not included in investment costs.
        cap.lo:
          type: numeric
          description: Lower bound on the total capacity (preexisting stock and new installations), ignored if NA.
        cap.up:
          type: numeric
          description: Upper bound on the total capacity (preexisting stock and new installations), ignored if NA.
        cap.fx:
          type: numeric
          description: Fixed total capacity (preexisting stock and new installations), ignored if NA. This parameter overrides `cap.lo` and `cap.up`.
        ncap.lo:
          type: numeric
          description: Lower bound on the new capacity (new installations), ignored if NA.
        ncap.up:
          type: numeric
          description: Upper bound on the new capacity (new installations), ignored if NA.
        ncap.fx:
          type: numeric
          description: Fixed new capacity (new installations), ignored if NA. This parameter overrides `ncap.lo` and `ncap.up`.
        ret.lo:
          type: numeric
          description: Lower bound on the capacity retirement (age-based), ignored if NA.
        ret.up:
          type: numeric
          description: Upper bound on the capacity retirement (age-based), ignored if NA.
        ret.fx:
          type: numeric
          description: Fixed capacity retirement (age-based), ignored if NA. This parameter overrides `ret.lo` and `ret.up`.
    optimizeRetirement:
      type: logical
      description: >
        Incidates if the retirement of the technology should be optimized.
        Also requires the same parameter in the `model` or `scenario` class to be set to TRUE to be effective.
    fullYear:
      type: logical
      description: >
        Indicates if the technology operates on a full-year basis, i.e. where its timeslice cycle
        closes. Currently it affects RAMPING only (`ramp` slot): with TRUE (default) the preceding
        timeslice of the first timeslice of a group is the last timeslice of the previous group;
        with FALSE each parent timeframe is an independent loop. A technology without ramping
        constraints is unaffected. See the `storage` class, where the same flag governs the
        state-of-charge balance.
    timeframe:
      type: character
      description: >
        Name of timeframe level the technology is operating. By default,
        the lowest level of timeframe of commodities used in the technology is applied.
    region:
      type: character
      description: >
        Vector of regions where the technology exists or can be installed.
        Optional. If not specified, the technology is applied to all regions.
        If specified, must include all regions used in other slots.
    misc:
      type: list
      description: >
        List of additional parameters that are not used in the model but can be used
        for reference or user-defined functions. For example, links to the source
        of the technology data, or other metadata. Two names are conventional:
        `misc$image`, a path or URL to an illustration used in reports (the `image`
        scalar of a techspec YAML file lands here), and `misc$icon`, a path or URL
        to a small icon.
## storage ######################################################################
  storage:
    name:
      type: character
      description: Name of the storage (used in sets).
    desc:
      type: character
      description: Description of the storage.
    input:
      type: data.frame
      description: >
        The commodity that FILLS the store -- the "charger" side. Named by
        `comm`, with an optional `unit`. Left empty it takes whatever `newStorage(commodity = )` supplied.
      columns:
        comm:
          type: character
          description: Commodity consumed to fill the store.
        unit:
          type: character
          description: >
            Unit of `comm` on this side, exactly as on `technology@input`/
            `@output`. Descriptive only: it is carried for reporting and
            `convert()` and never reaches the solver. It is the unit of the
            COMMODITY (e.g. MWh), not of the capacity -- capacity units follow
            from `cap2act`, and the storing side has no `cap2act` because a
            reservoir is an amount rather than a rate.
        cap2act:
          type: numeric
          description: >
            Capacity to ANNUAL flow, exactly as `technology@cap2act`. The flow
            bound is `cinp.up * cap2act * cap * pTimesliceShare`, so `cap` is a
            RATE and means the same physical thing on any calendar. Defaults to
            8760 (hours in a year), which makes `cap` read as commodity per
            HOUR; an hourly full-year model is unchanged because
            8760 * (1/8760) = 1. Assumes commodity unit = capacity unit x hour
            (GW with GWh); GW with TWh wants 8.76. The STORING side has no
            cap2act -- energy is energy at any resolution.
    output:
      type: data.frame
      description: >
        The commodity the store RELEASES -- the "discharger" side. Named by
        `comm`, with an optional `unit`. Left empty it takes whatever `newStorage(commodity = )` supplied.
      columns:
        comm:
          type: character
          description: Commodity produced when the store discharges.
        unit:
          type: character
          description: >
            Unit of `comm` on this side, exactly as on `technology@input`/
            `@output`. Descriptive only: it is carried for reporting and
            `convert()` and never reaches the solver. It is the unit of the
            COMMODITY (e.g. MWh), not of the capacity -- capacity units follow
            from `cap2act`, and the storing side has no `cap2act` because a
            reservoir is an amount rather than a rate.
        cap2act:
          type: numeric
          description: >
            Capacity to ANNUAL flow, exactly as `technology@cap2act`. The flow
            bound is `cinp.up * cap2act * cap * pTimesliceShare`, so `cap` is a
            RATE and means the same physical thing on any calendar. Defaults to
            8760 (hours in a year), which makes `cap` read as commodity per
            HOUR; an hourly full-year model is unchanged because
            8760 * (1/8760) = 1. Assumes commodity unit = capacity unit x hour
            (GW with GWh); GW with TWh wants 8.76. The STORING side has no
            cap2act -- energy is energy at any resolution.
    storage:
      type: data.frame
      description: >
        The commodity the store HOLDS -- what `vStorageLevel` is measured in. Named
        by `comm`, with an optional `unit`. Left empty it takes whatever `newStorage(commodity = )`
        supplied. It may differ from BOTH flows: a hydrogen store consumes and
        produces electricity while holding hydrogen.
        There is no `commodity` slot -- `newStorage(commodity = )` is a shorthand
        folded into these three at construction, so an object never carries two
        answers to what it consumes.
        Beyond `comm`, this slot carries the storing side's OWN capacity and
        economics, measured in ENERGY (e.g. MWh) rather than power. Supplying any
        of them materialises `vStorageStgCap`, so the store's energy can be sized,
        bounded and priced independently of its inverter; supplying none of them
        (a bare `comm`) leaves the storage with a single power capacity and the
        pre-v0.84 model, with `@duration` inlined into the availability bounds.
      columns:
        comm:
          type: character
          description: Commodity held in the store.
        unit:
          type: character
          description: >
            Unit of `comm` on this side, exactly as on `technology@input`/
            `@output`. Descriptive only: it is carried for reporting and
            `convert()` and never reaches the solver. It is the unit of the
            COMMODITY (e.g. MWh), not of the capacity -- capacity units follow
            from `cap2act`, and the storing side has no `cap2act` because a
            reservoir is an amount rather than a rate.
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for all.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for all.
        region:
          type: character
          description: Region the row applies to, NA for all.
        year:
          type: integer
          description: Year the row applies to, NA for all.
        stock:
          type: numeric
          description: >
            Pre-existing energy capacity, in commodity units. The energy analogue
            of `capacity$stock`, which is power.
        cap.lo:
          type: numeric
          description: Lower bound on total energy capacity.
        cap.up:
          type: numeric
          description: Upper bound on total energy capacity.
        cap.fx:
          type: numeric
          description: Fixed total energy capacity.
        ncap.lo:
          type: numeric
          description: Lower bound on new energy capacity added in the period.
        ncap.up:
          type: numeric
          description: Upper bound on new energy capacity added in the period.
        ncap.fx:
          type: numeric
          description: Fixed new energy capacity added in the period.
        invcost:
          type: numeric
          description: >
            Overnight investment cost per unit of ENERGY capacity (currency/MWh),
            annuitised on the storage's own `@vintage` -- one lifetime and one
            wacc for the object, two capital costs on different bases. This is
            what previously had to be hand-multiplied into the per-MW `@invcost`.
        fixom:
          type: numeric
          description: Fixed O&M cost per unit of energy capacity per year.
    cluster:
      type: data.frame
      description: >-
        Declaration of the storage clusters -- parallel sub-processes of the same
        storage with their own capacity, availability and costs. The motivating
        cases are site-constrained storage (pumped-hydro head classes, CAES
        caverns) and duration classes via a per-cluster `duration`. Optional: when
        empty, cluster labels are harvested from the other slots; when populated
        it is authoritative and an undeclared label raises an error.
      columns:
        cluster:
          type: character
          description: Cluster label. Must match the `cluster` column values used in the other slots.
        desc:
          type: character
          description: Human-readable description of the cluster, used in reports.
        region:
          type: character
          description: Region the cluster exists in, NA for every region.
        order:
          type: integer
          description: Optional display/ranking order; controls the order variants are created and reported in.
    vintage:
      type: data.frame
      description: >-
        Investment window and operational life of the storage, one row per
        (vintage, region, cluster). Replaces the former `start`, `end` and
        `olife` slots. A vintage is a separately investable variant that keeps
        the characteristics of its build year for its whole life -- for storage
        typically a falling capex and a rising round-trip efficiency.
      columns:
        vintage:
          type: character
          description: Vintage label, normally the build year as a string. NA for an un-vintaged storage.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        cluster:
          type: character
          description: Cluster label, NA for every cluster.
        start:
          type: integer
          description: The first year the storage can be installed. NA means unbounded (up to `end`).
        end:
          type: integer
          description: The last year the storage can be installed. NA means unbounded (from `start` on).
        olife:
          type: integer
          description: Operational life of the storage in years, applicable to new investment only.
    aux:
      type: data.frame
      description: Auxiliary commodities.
      columns:
        acomm:
          type: character
          description: Name of the auxiliary commodity (used in sets).
        unit:
          type: character
          description: Unit of the auxiliary commodity.
    startLevel:
      type: data.frame
      description: >
        Energy added to the storage level ONCE PER CYCLE, at the first timeslice
        of the cycle. There is deliberately no `timeslice` column: the slice is
        derived from the calendar and `fullYear`, so it cannot be left unset and
        broadcast to every timeslice the way the old `charge` slot could.
        Which cycle depends on `fullYear`: once a year when TRUE, once per parent
        timeframe when FALSE.
        The value is ANNUAL. When the cycle is shorter than a year each cycle
        receives its own SHARE of it -- 365 daily cycles get 1/365 each -- so the
        annual endowment is the same however the cycle closes. A calendar covering
        part of a year endows that fraction, consistently.
        It is FREE to the model, by design and unavoidably -- a store that ends a
        cycle below where it started has consumed an endowment nobody paid for.
        PyPSA's `state_of_charge_initial` has the same property.
        Being additive, the level at the first timeslice is `startLevel` PLUS
        whatever carried over from the previous cycle, i.e. at least `startLevel`
        rather than exactly it; the model may end the cycle empty to make it exact.
        Renamed from `charge` (via `inflow`) in v0.80; both are still accepted
        with a warning, and any `timeslice` column they carried is dropped.
        NOTE hydro inflow does NOT belong here -- use a weather-driven `supply`
        (with `ava.up`, so spilling is free) feeding the storage.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        startLevel:
          type: numeric
          description: Energy added to the level at the first timeslice of each cycle.
    seff:
      type: data.frame
      description: Storage efficiency parameters.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Time timeslice to apply the parameter, NA for every timeslice.
        stgeff:
          type: numeric
          description: Storage decay annual rate.
        inpeff:
          type: numeric
          description: Input efficiency rate.
        outeff:
          type: numeric
          description: Output efficiency rate.
    af:
      type: data.frame
      description: Availability factor parameters.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Time timeslice to apply the parameter, NA for every timeslice.
        af.lo:
          type: numeric
          description: Lower bound of the availability factor.
        af.up:
          type: numeric
          description: Upper bound of the availability factor.
        af.fx:
          type: numeric
          description: Fixed value of the availability factor. This parameter overrides `af.lo` and `af.up`.
        cinp.lo:
          type: numeric
          description: Lower bound of the input commodity availability factor.
        cinp.up:
          type: numeric
          description: Upper bound of the input commodity availability factor.
        cinp.fx:
          type: numeric
          description: >
            Fixed value of the input commodity availability factor.
            This parameter overrides `cinp.lo` and `cinp.up`.
        cout.lo:
          type: numeric
          description: Lower bound of the output commodity availability factor.
        cout.up:
          type: numeric
          description: Upper bound of the output commodity availability factor.
        cout.fx:
          type: numeric
          description: >
            Fixed value of the output commodity availability factor.
            This parameter overrides `cout.lo` and `cout.up`.
    aeff:
      type: data.frame
      description: Auxiliary commodities efficiency parameters.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        acomm:
          type: character
          description: Name of the auxiliary commodity (used in sets).
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Time timeslice to apply the parameter, NA for every timeslice.
        stg2ainp:
          type: numeric
          description: Storaage-level-to-auxiliary-input-commodity coefficient (multiplier).
        cinp2ainp:
          type: numeric
          description: Input-commodity-to-auxiliary-input-commodity coefficient (multiplier).
        cout2ainp:
          type: numeric
          description: Output-commodity-to-auxiliary-input-commodity coefficient (multiplier).
        stg2aout:
          type: numeric
          description: Storage-level-to-auxiliary-output-commodity coefficient (multiplier).
        cinp2aout:
          type: numeric
          description: Input-commodity-to-auxiliary-output-commodity coefficient (multiplier).
        cout2aout:
          type: numeric
          description: Output-commodity-to-auxiliary-output-commodity coefficient (multiplier).
        cap2ainp:
          type: numeric
          description: Capacity-to-auxiliary-input-commodity coefficient (multiplier).
        cap2aout:
          type: numeric
          description: Capacity-to-auxiliary-output-commodity coefficient (multiplier).
        ncap2ainp:
          type: numeric
          description: New-capacity-to-auxiliary-input-commodity coefficient (multiplier).
        ncap2aout:
          type: numeric
          description: New-capacity-to-auxiliary-output-commodity coefficient (multiplier).
        ncap2stg:
          type: numeric
          description: New-capacity-to-storage-level coefficient (multiplier).
    fixom:
      type: data.frame
      description: Fixed operation and maintenance cost.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        fixom:
          type: numeric
          description: Fixed operation and maintenance cost for the specified sets.
    varom:
      type: data.frame
      description: Variable operation and maintenance cost.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Time timeslice to apply the parameter, NA for every timeslice.
        inpcost:
          type: numeric
          description: Costs associated with the input commodity.
        outcost:
          type: numeric
          description: Costs associated with the output commodity.
        stgcost:
          type: numeric
          description: Costs associated with the storage level.
    invcost:
      type: data.frame
      description: Investment cost.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        invcost:
          type: numeric
          description: Overnight investment cost for the specified region and year.
        wacc:
          type: numeric
          description: >-
            Weighted average cost of capital used to annuitise `invcost` for
            this storage. Overrides the model-wide `wacc` (see the model
            `discount` argument). The social discount rate is never used here.
        payback:
          type: numeric
          description: >-
            Cost-recovery period in years. Where given it replaces `olife` in
            the annuity AND in the years over which the annuity is charged, so
            the investment is repaid over `payback` years while the capacity
            keeps operating for its full operational life. Must be positive and
            not exceed `olife`. Unset (or 0) means recover over `olife`.
            Implemented for the GLPK solver only.
        eac:
          type: numeric
          description: >-
            Equivalent annual cost, supplied directly instead of being computed
            from `invcost`, `wacc` and the lifetime. Where given it wins; where
            absent the annuity is computed. Mutually exclusive with `invcost`
            per row.
        retcost:
          type: numeric
          description: Costs of early retirement of the storage, default is 0.
    fullYear:
      type: logical
      description: >
        Controls where the charge/discharge cycle closes.
        If TRUE (default), the storage operates across parent timeframes through the whole year:
        the preceding time-timeslice of the first time-timeslice of a group is the last
        time-timeslice of the PREVIOUS group, and only the last time-timeslice of the year wraps
        round to the first. A battery on an hourly calendar nested under days can therefore carry
        energy from one day into the next, and seasonal storage is representable.
        If FALSE, the cycle is closed within each parent timeframe: the preceding time-timeslice of
        the first time-timeslice of a group is the LAST time-timeslice of the SAME group, so every
        group is an independent loop with no energy carried between them.
    region:
      type: character
      description: Region where the storage technology exists or can be installed.
    duration:
      type: data.frame
      description: >
        How long the store can run at its rated output: the ratio of storing
        capacity to (dis)charging capacity. `duration = 6` on an hourly calendar
        is a 6-hour store. Renamed from `cap2stg` in v0.80, which is still
        accepted with a warning.
        It is a BOUND on (storage, region, year): `duration.fx` ties energy to
        power, `duration.lo`/`duration.up` let the model choose the ratio -- which
        only bites when the storing side is priced, via `@storage$invcost`.
        The bare `duration` column is the scalar shorthand and is normalised to
        `duration.fx` at construction. A ONE-SIDED range opens the other side (an
        `up` alone does not inherit the default `lo` of 1). Saying nothing leaves
        the slot empty and the parameter default of [1, 1] ties energy to power at
        one hour, which is the pre-v0.84 behaviour.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        duration:
          type: numeric
          description: Capacity-to-storage ratio (storage duration).
        duration.lo:
          type: numeric
          description: Lower bound on the energy-to-power ratio, in hours.
        duration.up:
          type: numeric
          description: Upper bound on the energy-to-power ratio, in hours.
        duration.fx:
          type: numeric
          description: >
            Fixed energy-to-power ratio, in hours. The scalar shorthand
            `duration = 6` normalises to this.
    inp2out:
      type: data.frame
      description: >
        The charge-to-discharge capacity ratio, dimensionless: how big the
        charger is relative to the discharger. Same bound semantics as
        `duration` -- `inp2out.fx` ties the two (one bidirectional inverter),
        `inp2out.lo`/`.up` let the model size them apart, and the bare `inp2out`
        column is the scalar shorthand, normalised to `.fx` at construction. A
        one-sided range opens the other side. Saying nothing leaves the slot
        empty and the parameter default of [1, 1] keeps the two sides symmetric,
        which is what a storage without a separate charger has always been.
        It bites only when the charging side is priced or bounded via `@input`;
        otherwise there is no charging capacity variable to constrain.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for all.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for all.
        region:
          type: character
          description: Region the row applies to, NA for all.
        year:
          type: integer
          description: Year the row applies to, NA for all.
        inp2out:
          type: numeric
          description: Scalar shorthand, normalised to `inp2out.fx`.
        inp2out.lo:
          type: numeric
          description: Lower bound on the charge-to-discharge capacity ratio.
        inp2out.up:
          type: numeric
          description: Upper bound on the charge-to-discharge capacity ratio.
        inp2out.fx:
          type: numeric
          description: Fixed charge-to-discharge capacity ratio.

    weather:
      type: data.frame
      description: Weather factors multipliers.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        weather:
          type: character
          description: Name of the weather factor to apply.
        waf.lo:
          type: numeric
          description: Coefficient that links the weather factor with the lower bound of the availability factor.
        waf.up:
          type: numeric
          description: Coefficient that links the weather factor with the upper bound of the availability factor.
        waf.fx:
          type: numeric
          description: >
            Coefficient that links the weather factor with the fixed value of the availability factor.
            This parameter overrides `waf.lo` and `waf.up`.
        wcinp.lo:
          type: numeric
          description: >
            Coefficient that links the weather factor with the lower bound of the input commodity availability factor.
        wcinp.up:
          type: numeric
          description: >
            Coefficient that links the weather factor with the upper bound of the input commodity availability factor.
        wcinp.fx:
          type: numeric
          description: >
            Coefficient that links the weather factor with the fixed value of the input commodity availability factor.
            This parameter overrides `wcinp.lo` and `wcinp.up`.
        wcout.lo:
          type: numeric
          description: >
            Coefficient that links the weather factor with the lower bound of the output commodity availability factor.
        wcout.up:
          type: numeric
          description: >
            Coefficient that links the weather factor with the upper bound of the output commodity availability factor.
        wcout.fx:
          type: numeric
          description: >
            Coefficient that links the weather factor with the fixed value of the output commodity availability factor.
            This parameter overrides `wcout.lo` and `wcout.up`.
    misc:
      type: list
      description: >
        List of additional parameters that are not used in the model but can be used
        for reference or user-defined functions. For example, links to the source
        of the storage data, or other metadata.
    capacity:
      type: data.frame
      description: Capacity parameters of the storage technology.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        cluster:
          type: character
          description: Cluster label selecting the variant this row applies to, NA for every cluster. See the `cluster` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        cap:
          type: numeric
          description: Capacity of the storage technology.
        cap.lo:
          type: numeric
          description: Lower bound of the storage capacity.
        cap.up:
          type: numeric
          description: Upper bound of the storage capacity.
        cap.fx:
          type: numeric
          description: Fixed value of the storage capacity. This parameter overrides `cap.lo` and `cap.up`.
        ncap.lo:
          type: numeric
          description: Lower bound of the new storage capacity.
        ncap.up:
          type: numeric
          description: Upper bound of the new storage capacity.
        ncap.fx:
          type: numeric
          description: >
            Fixed value of the new storage capacity. This parameter overrides `ncap.lo` and `ncap.up`.
        ret.lo:
          type: numeric
          description: Lower bound of the storage capacity retirement.
        ret.up:
          type: numeric
          description: Upper bound of the storage capacity retirement.
        ret.fx:
          type: numeric
          description: >
            Fixed value of the storage capacity retirement. This parameter overrides `ret.lo` and `ret.up`.
    optimizeRetirement:
      type: logical
      description: >
        Incidates if the retirement of the storage should be optimized.
        Also requires the same parameter in the `model` or `scenario` class to be set to TRUE to be effective.
## trade ########################################################################
  trade:
    name:
      type: character
      description: Name of the trade object, used in sets.
    desc:
      type: character
      description: Description of the trade object.
    commodity:
      type: character
      description: The traded commodity short name.
    routes:
      type: data.frame
      description: Source and destination regions. For bivariate trade define both directions in separate rows.
      columns:
        from:
          type: character
          description: Source region.
        to:
          type: character
          description: Destination region.
    trade:
      type: data.frame
      description: Technical parameters of trade.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Time timeslice to apply the parameter, NA for every timeslice.
        trade:
          type: numeric
          description: Trade volume.
    aux:
      type: data.frame
      description: Auxiliary commodity of trade.
      columns:
        acomm:
          type: character
          description: Name of the auxiliary commodity (used in sets).
        unit:
          type: character
          description: Unit of the auxiliary commodity.
    aeff:
      type: data.frame
      description: Auxiliary commodity efficiency parameters.
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        acomm:
          type: character
          description: Name of the auxiliary commodity (used in sets).
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        timeslice:
          type: character
          description: Time timeslice to apply the parameter, NA for every timeslice.
        trade2ainp:
          type: numeric
          description: Trade-to-auxiliary-input-commodity coefficient (multiplier).
        trade2aout:
          type: numeric
          description: Trade-to-auxiliary-output-commodity coefficient (multiplier).
    invcost:
      type: data.frame
      description: Investment cost of the trade capacity (per unit of capacity).
      columns:
        vintage:
          type: character
          description: Vintage label selecting the variant this row applies to, NA for every vintage. See the `vintage` slot.
        region:
          type: character
          description: Region name to apply the parameter, NA for every region.
        year:
          type: integer
          description: Year to apply the parameter, NA for every year.
        invcost:
          type: numeric
          description: Investment cost.
        wacc:
          type: numeric
          description: >-
            Weighted average cost of capital used to annuitise `invcost` for
            this corridor. Overrides the model-wide `wacc` (see the model
            `discount` argument). The social discount rate is never used here.
        payback:
          type: numeric
          description: >-
            Cost-recovery period in years. Where given it replaces `olife` in
            the annuity AND in the years over which the annuity is charged, so
            the investment is repaid over `payback` years while the capacity
            keeps operating for its full operational life. Must be positive and
            not exceed `olife`. Unset (or 0) means recover over `olife`.
            Implemented for the GLPK solver only.
        eac:
          type: numeric
          description: >-
            Equivalent annual cost, supplied directly instead of being computed
            from `invcost`, `wacc` and the lifetime. Where given it wins; where
            absent the annuity is computed. Mutually exclusive with `invcost`
            per row.
        retcost:
          type: numeric
          description: Costs of early retirement of the trade capacity, default is 0.
    vintage:
      type: data.frame
      description: >-
        Investment window and operational life of the trade object, one row per
        vintage. Replaces the former `start`, `end` and `olife` slots. A vintage
        is a separately investable variant that keeps the characteristics of its
        build year for its whole life, so several vintages of one corridor mean
        several capacities on the same `(src, dst)` route, with their flows
        summed in the commodity balance. `region` and `cluster` are present for a
        uniform shape across process classes but are unused for trade: its scope
        comes from the route endpoints, and `routes` already provides the
        multiplicity a cluster dimension would add.
      columns:
        vintage:
          type: character
          description: Vintage label, normally the build year as a string. NA for an un-vintaged trade.
        region:
          type: character
          description: Unused for trade (no `region` slot); present for consistency with the other classes.
        cluster:
          type: character
          description: Unused for trade (no cluster dimension); present for consistency with the other classes.
        start:
          type: integer
          description: The first year the trade object is available for investment. NA means unbounded (up to `end`).
        end:
          type: integer
          description: The last year the trade object is available for investment. NA means unbounded (from `start` on).
        olife:
          type: integer
          description: Operational life of the trade object in years.
    cap2act:
      type: numeric
      description: Capacity to activity ratio.
    misc:
      type: list
      description: Additional information.
    fixom:
      type: data.frame
      description: (not implemented!) Fixed operation and maintenance costs.
    varom:
      type: data.frame
      description: (not implemented!) Variable operation and maintenance costs.
    capacity:
      type: data.frame
      description: (not implemented!) Capacity parameters of the trade object.
    optimizeRetirement:
      type: logical
      description: >
        Incidates if the retirement of the trade object should be optimized.
        Also requires the same parameter in the `model` or `scenario` class to be set to TRUE to be effective.
