# duration = storing capacity / output capacity, in HOURS.
#
# Was `numpar` on `stg` alone: one number per storage for all regions and all
# years, and not a bound -- so a 6-hour battery could not become an 8-hour one
# in a later year, and the ratio could never be chosen by the model. Now a
# `bounds` parameter on (stg, region, year): `.fx` ties the two capacities,
# `.lo`/`.up` open the ratio.
#
# defVal [1, 1] is the legacy tie: a storage that says nothing about duration
# keeps energy = 1 h x power, exactly as before. `newStorage()` opens the other
# side when the user gives a one-sided range, so this default never leaks into
# a deliberate `duration.up = 8`.
# --- the STORING part's own capacity and economics -------------------------- #
# Measured in ENERGY (e.g. MWh), unlike every other pStorage* capacity, which is
# power. These exist so a battery's energy can be sized and priced separately
# from its inverter; before this, `@duration` welded the two at a fixed ratio and
# the EUR/MWh component had to be hand-multiplied into the EUR/MW number.
#
# Their presence is also the STRUCTURE-FOLLOWS-DATA gate: `mStorageStgCap` is the
# set of points where any of them carries a value, and only there does
# `vStorageStgCap` exist. A storage that says nothing about its storing side
# keeps exactly one capacity variable and the previous LP.
