# --- capacity -> annual flow, so a capacity is a RATE ------------------------ #
# The flow bounds read `inp.af.up * cap2act * cap * pTimesliceShare[s]`, mirroring
# eqTechAfUp. Without the share factor `cap` meant "commodity per TIMESLICE": the
# same storage allowed 7 per hour on a 24 x 1-hour calendar and 1.75 per hour on
# a 6 x 4-hour one, so refining the resolution silently shrank every store.
#
# defVal 8760 = hours in a year, which makes `cap` "commodity per hour" on ANY
# calendar. On d365_h24 (and on representative-day subsets, whose leaf share is
# still 1/8760) the factor is exactly 1, so those models do not move at all.
# Assumes commodity unit = capacity unit x hour, i.e. GW with GWh; GW with TWh
# wants 8.76. Unlike pTechCap2act (defVal 1) because a storage has an intrinsic
# clock -- the level -- that a technology's activity does not.
#
