  name: pStorageStgStock
  dimSets:
  - stg
  - region
  - year
  type: numpar
  defVal: 0.0
  interpolation: back.inter.forth
  colName: stg.stock
  recast: {space: sum}
  unit: "{capacity}"
  class: storage
  slot: capacity
