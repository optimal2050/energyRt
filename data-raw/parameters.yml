# The model's PARAMETERS -- the single authority for each one's `dimSets`,
# `defVal` and `interpolation`, and for the class / slot / column it is written
# from. Maintained BY HAND, one top-level key per parameter.
# `config@defVal` / `@interpolation` can override a value per model, but they
# declare nothing: they are empty until a user sets a key.
# Read by `DATASET.R` into `.modInp` (R/sysdata.rda). Editing this file does
# nothing until `DATASET.R` is re-run from the package root and the regenerated
# `R/sysdata.rda` is committed.
# Companions: sets.yml, mappings.yml. See data-raw/README.md.
pPeriodLen:
  name: pPeriodLen
  dimSets: year
  type: numpar
  defVal: 0.0
  interpolation: inter.forth
  colName: ''
  class: horizon
  function: fn$pPeriodLen
ordYear:
  name: ordYear
  dimSets: year
  type: numpar
  defVal: 0.0
  interpolation: inter.forth
