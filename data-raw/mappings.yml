# The model's MAPPINGS -- the membership and domain sets the equations are
# generated over. Maintained BY HAND, one top-level key per mapping.
# How each one is BUILT is a separate file: `mapping_spec.yml` holds the build
# recipes for these same symbols.
# Read by `DATASET.R` (into `.modInp`, R/sysdata.rda) and by
# `make_mapping_spec.R`, which backfills dims from here. Editing this file does
# nothing until `DATASET.R` is re-run from the package root and the regenerated
# `R/sysdata.rda` is committed.
# Companions: sets.yml, parameters.yml. See data-raw/README.md.
