# The model's SETS -- the index spaces every mapping and parameter is declared
# over. Maintained BY HAND, one top-level key per set.
# Read by `DATASET.R` (into `.modInp`, R/sysdata.rda) and by
# `make_mapping_spec.R`. Editing this file does nothing until `DATASET.R` is
# re-run from the package root and the regenerated `R/sysdata.rda` is
# committed.
# Companions: parameters.yml, mappings.yml. See data-raw/README.md.
