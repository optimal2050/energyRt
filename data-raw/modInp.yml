# Availability factor of the flow on one directed route, as a fraction of the
# object's own capacity (cap2act x vTradeCap x timeslice share). Unlike
# `pTradeIr` (colName `ava`), which is an absolute commodity quantity, this
# scales with the capacity decision -- which is what lets one trade object
# carrying a whole network give each line its own rating. Gated by
# meqTradeIrAfLo / meqTradeIrAfUp, so it costs nothing unless declared.
pTradeIrAf:
  name: pTradeIrAf
  dimSets:
  - trade
  - src
  - dst
  - year
  - timeslice
  type: bounds
  defVal:
