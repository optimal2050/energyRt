# Phase-out domain: span years that HAVE a predecessor span year. The first
# year of a process's span is excluded -- phase-out is a transition between
# milestones, so nothing has aged out yet at the start. Declaring the
# variable over this map (rather than the whole span) also stops a phase-out
# CREDIT from being unbounded at the first year, where no equation binds it.
mvTechPhaseOut:
  name: mvTechPhaseOut
  type: map
  dimSets:
  - tech
  - region
  - year
mvStoragePhaseOut:
  name: mvStoragePhaseOut
  type: map
  dimSets:
  - stg
  - region
  - year
# Trade capacity is region-free (`vTradeCap{trade, year}`), so its phase-out
# domain drops the region as the rest of the trade family does.
mvTradePhaseOut:
  name: mvTradePhaseOut
  type: map
  dimSets:
  - trade
  - year
