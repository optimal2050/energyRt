url: https://energyRt.org

# Convention: figures are built on a SOLID background -- transparent PNGs
# are illegible in the site's dark mode. pkgdown/extra.scss then stops the
# dark theme inverting them (see optimal2050 CONVENTIONS.md).
figures:
  bg: "white"

template:
  bootstrap: 5
  light-switch: true
  bslib:
    bootswatch: flatly
    pkgdown-navbar-bg: '#2C3E50'
  # bootswatch: sandstone
  # bootswatch: spacelab
  # bootswatch: lux
  # navbar:
    # bg: dark
    # fg: dark
    # bg: primary
  # params:
