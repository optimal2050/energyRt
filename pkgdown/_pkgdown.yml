reference:

# ---------------------------------------------------------------- describing -
- title: Model components
  desc: >
    The S4 classes a model is made of. Each is built by its `new*()`
    constructor below and carries its data in slots.
  contents:
  - starts_with("class-")
  - ends_with("-class")

- title: Building a model
  desc: >
    Constructors for the objects above, the repository that holds them, and the
    model that binds them to a calendar, regions and a horizon.
  contents:
  - newModel
  - newRepository
  - newCommodity
  - newTechnology
  - newStorage
  - newSupply
  - newDemand
  - newTrade
  - newACLine
  - newDCLink
  - newImport
  - newExport
  - newWeather
  - newConstraint
  - newCosts
  - newTax
  - newSubsidy
  - newScenario
  - newRegistry
  - add,repository-method
  - update
  - update,export-method
  - update,supply-method
  - asSupplyCurve
  - lossTranches
  - combine_vintages

- title: Time resolution
  desc: >
    Calendars and horizons. The shipped `calendars` catalog is generated with
    the sibling *timescales* package; `newCalendar()` builds your own.
  contents:
  - newCalendar
  - newHorizon
  - calendars
  - horizons
  - make_timetable
  - autoplot.calendar
  - autoplot.horizon

- title: Space resolution
  desc: >
    Multi-level regions. A commodity declares the level it balances on, and
    coarse balances roll up without a `trade` route for every pair.
  contents:
  - setGeoscale,config-method
  - utopia_geoscale
  - check_geoscale_regions
  - plot_geoscale
  - get_region
  - subset_model_regions
  - aggregate_model_regions

- title: Process specifications
  desc: >
    Portable YAML/JSON process definitions, and the interactive designer.
  contents:
  - process_from_spec
  - process_to_spec
  - process_spec_code
  - process_spec_issues
  - read_process_spec
  - process_designer
  - read_technology_xlsx
  - write_technology_xlsx

# ------------------------------------------------------------------ solving -
- title: Interpolating and solving
  desc: >
    The core pipeline. `solve_model()` does the whole sequence; the separate
    verbs let a stage be inspected or re-run.
  contents:
  - interpolate_model
  - solve_model
  - write_script
  - read_solution
  - read_sequence
  - with_solver_log

- title: Solver configuration
  desc: Choosing a backend and pointing energyRt at it.
  contents:
  - get_default_solver
  - get_solver_path
  - set_solver_path
  - set_gams_path
  - get_exchange_format
  - get_storage_format

- title: Remote and cloud solving
  desc: >
    Solving where you are not: the NEOS server for GAMS/CPLEX without a local
    licence, and GPU/cloud execution for models too large for a laptop.
  contents:
  - starts_with("neos")
  - get_neos_email
  - get_hf_token

- title: Solve drivers
  desc: >
    Sequences of solves — myopic foresight, sampled calendars, region-by-region
    decomposition, and guided target-seeking — with their primitives.
  contents:
  - solve_myopic
  - solve_by_sample
  - solve_by_region
  - solve_guided
  - horizon_windows
  - solution_ledger
  - apply_ledger
  - myopic_objective
  - calendar_samples
  - sample_summary
  - boundary_window
  - guided_windows
  - guided_gap
  - solution_targets
  - apply_targets

# ------------------------------------------------------------------ results -
- title: Reading results
  desc: Getting tidy data out of a solved scenario.
  contents:
  - getData
  - get_variable
  - get_weather
  - getMix
  - getObject
  - getScenario
  - getVariants
  - variantSummary
  - findData
  - find_in_model
  - findDuplicates
  - size
  - model_size

- title: Levelized cost
  desc: >
    Pricing a technology a-priori (screening LCOE) or ex-post from a solved
    scenario.
  contents:
  - levcost
  - tech_share_frontier
  - plot_share_frontier
  - clear_levcost_cache
  - storage_duration

- title: Reporting
  desc: Rendered datasheets for models, scenarios and processes.
  contents:
  - report
  - report_html
  - report_pdf
  - report_docx
  - report_tex
  - report_templates
  - report_helpers
  - clear_report_cache
  - set_reports_path

- title: Comparison
  desc: >
    Compare scenarios' solved results (or runs of one scenario), models'
    declarations, and interpolated model inputs.
  contents:
  - starts_with("compare")

- title: Visualisation
  desc: Plots and diagrams.
  contents:
  - starts_with("autoplot")
  - draw
  - plot
  - plot_heatmap
  - plot_map
  - plot_trade_map
  - object_image
  - theme_energyRt
  - ghost_options
  - design

# ------------------------------------------------------------------ storage -
- title: Saving and loading
  desc: >
    Models, repositories and scenarios on disk — Arrow-backed, so results
    larger than memory stay readable.
  contents:
  - save_model
  - save_repository
  - save_scenario
  - load_scenario
  - seal_model
  - model_hash
  - repository_hash
  - dataset_hash
  - object_hash
  - isInMemory
  - isOnDisk
  - obj2mem
  - materialize_weather

- title: Scenario runs and artifacts
  desc: >
    What a solved scenario leaves on disk, which solution to keep, and how to
    hand a folder to somebody else.
  contents:
  - scenario_runs
  - scenario_solutions
  - scenario_artifacts
  - import_solution
  - promote_solution
  - drop_scenario_run
  - drop_solver_outputs
  - upgrade_scenario_layout
  - store_dependents
  - strip_user_info
  - prepare_for_sharing
  - matches("registry")
  - matches("dataset")
  - matches("marked")

# --------------------------------------------------------------- validation -
- title: Validation and diagnostics
  desc: >
    Checks on a model's inputs, on an interpolated scenario, and on a solved
    one. `verify_solution()` re-derives the model's identities from the results.
  contents:
  - validate_scenario_parameters
  - verify_solution
  - en_check
  - en_check_packages
  - trim_parameters_by_maps
  - update_parameter

# ----------------------------------------------------------------- the rest -
- title: Datasets
  desc: Data bundled with the package for the examples and articles.
  contents:
  - utopia
  - utopia_profile
  - utopia_profiles
  - vre_cf
  - vre_storage_duration

- title: Setup and environment
  desc: Installing and checking the solver toolchains.
  contents:
  - en_setup
  - starts_with("en_install")
  - en_config_path
  - en_config_show

- title: Options and paths
  desc: Package options, and where energyRt reads and writes.
  contents:
  - energyRt-options
  - set_option
  - set_path_builder
  - set_scenarios_path
  - set_registry_file
  - set_log_file
  - set_progress_bar
  - get_default_value
  - isVerbose
  - isDebug

- title: Utilities
  desc: Small helpers, conversions and accessors.
  contents:
  - starts_with("get_process")
  - getUnits
  - commodity_properties
  - commodity_property
  - convert_data
  - convert,character-method
  - renameSets
  - revalueSets
  - register_weather_transform
  - hour2HOUR
  - yday2YDAY
  - print,modelData-method
  - summary,model-method

footer:
  structure:
    left: package
    right: built_with

